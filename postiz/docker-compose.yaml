# Postiz - Neuinstanz (Coolify, Docker Compose)
#
# Bildet die alte One-Click-Instanz nach, mit diesen Unterschieden:
#   1. Image ist auf eine feste Version gepinnt statt :latest. Die alte Instanz
#      zog ueber :latest v2.23.0, und ab v2.13 ist ein Temporal-Server Pflicht -
#      ohne den bricht der Backend-Start ab ("Backend failed to start on 3000").
#   2. Postgres-, Uploads- und Config-Volume der alten Instanz haengen per
#      Bind-Mount drin, damit die Daten erhalten bleiben.
#   3. postgres-password-sync gleicht das Rollen-Passwort an POSTIZ_DB_PASSWORD an.
#      Bewusst keine SERVICE_*-Variable: die generiert Coolify selbst neu, und
#      Sonderzeichen darin zerlegen die DATABASE_URL von Postiz.
#   4. Temporal laeuft als Teil dieses Stacks. Der separate Temporal-Service
#      waere nur ueber Coolifys gemeinsames Docker-Netz erreichbar - genau daran
#      ist die alte Instanz gescheitert. Im Stack reicht die Compose-interne
#      Namensaufloesung.
#   5. Die Dienste heissen eindeutig (postiz-db statt postgres): im gemeinsamen
#      Docker-Netz, das Traefik zum Routen braucht, kollidieren generische
#      Namen sonst mit gleichnamigen Containern anderer Stacks.
#
# Versionswahl: v2.23.0 passt zum Schema der uebernommenen DB. Ab v2.13 ist
# Temporal Pflicht; v2.11.0 und aelter kaemen ohne aus, wuerden dafuer aber die
# Spalten shortlink, creationMethod, delay und sendStreakEmails loeschen.
#
# WICHTIG: Die alte Instanz (Service vcjzigduzuxw3cp5xxydolt0) muss gestoppt
# bleiben, solange diese hier laeuft - beide teilen sich das Postgres-Volume.

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.23.0
    environment:
      - SERVICE_URL_POSTIZ_5000
      - MAIN_URL=${SERVICE_URL_POSTIZ}
      - FRONTEND_URL=${SERVICE_URL_POSTIZ}
      - NEXT_PUBLIC_BACKEND_URL=${SERVICE_URL_POSTIZ}/api
      - JWT_SECRET=${SERVICE_PASSWORD_JWTSECRET}
      - DATABASE_URL=postgresql://postgres:${POSTIZ_DB_PASSWORD}@postiz-db:5432/${POSTGRESQL_DATABASE:-postiz-db}
      - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@postiz-redis:6379
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-false}
      # Temporal aus diesem Stack, aufgeloest ueber das Compose-Netz.
      - TEMPORAL_ADDRESS=postiz-temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}

      # Cloudflare R2
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_ACCESS_KEY=${CLOUDFLARE_ACCESS_KEY}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKETNAME=${CLOUDFLARE_BUCKETNAME}
      - CLOUDFLARE_BUCKET_URL=${CLOUDFLARE_BUCKET_URL}
      - CLOUDFLARE_REGION=${CLOUDFLARE_REGION}

      # Storage
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - UPLOAD_DIRECTORY=${UPLOAD_DIRECTORY:-/uploads}
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=${NEXT_PUBLIC_UPLOAD_DIRECTORY:-/uploads}
      - NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY=${NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY}

      # E-Mail
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}

      # Social-Media-APIs
      - X_API_KEY=${SERVICE_X_API}
      - X_API_SECRET=${SERVICE_X_SECRET}
      - LINKEDIN_CLIENT_ID=${SERVICE_LINKEDIN_ID}
      - LINKEDIN_CLIENT_SECRET=${SERVICE_LINKEDIN_SECRET}
      - REDDIT_CLIENT_ID=${SERVICE_REDDIT_API}
      - REDDIT_CLIENT_SECRET=${SERVICE_REDDIT_SECRET}
      - GITHUB_CLIENT_ID=${SERVICE_GITHUB_ID}
      - GITHUB_CLIENT_SECRET=${SERVICE_GITHUB_SECRET}
      - THREADS_APP_ID=${SERVICE_THREADS_ID}
      - THREADS_APP_SECRET=${SERVICE_THREADS_SECRET}
      - FACEBOOK_APP_ID=${SERVICE_FACEBOOK_ID}
      - FACEBOOK_APP_SECRET=${SERVICE_FACEBOOK_SECRET}
      - YOUTUBE_CLIENT_ID=${SERVICE_YOUTUBE_ID}
      - YOUTUBE_CLIENT_SECRET=${SERVICE_YOUTUBE_SECRET}
      - TIKTOK_CLIENT_ID=${SERVICE_TIKTOK_ID}
      - TIKTOK_CLIENT_SECRET=${SERVICE_TIKTOK_SECRET}
      - PINTEREST_CLIENT_ID=${SERVICE_PINTEREST_ID}
      - PINTEREST_CLIENT_SECRET=${SERVICE_PINTEREST_SECRET}
      - DRIBBBLE_CLIENT_ID=${SERVICE_DRIBBLE_ID}
      - DRIBBBLE_CLIENT_SECRET=${SERVICE_DRIBBLE_SECRET}
      - DISCORD_CLIENT_ID=${SERVICE_DISCORD_ID}
      - DISCORD_CLIENT_SECRET=${SERVICE_DISCORD_SECRET}
      - DISCORD_BOT_TOKEN_ID=${SERVICE_DISCORD_TOKEN}
      - SLACK_ID=${SERVICE_SLACK_ID}
      - SLACK_SECRET=${SERVICE_SLACK_SECRET}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - MASTODON_CLIENT_ID=${SERVICE_MASTODON_ID}
      - MASTODON_CLIENT_SECRET=${SERVICE_MASTODON_SECRET}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}

      # Weitere Integrationen
      - BEEHIIVE_API_KEY=${SERVICE_BEEHIIVE_KEY}
      - BEEHIIVE_PUBLICATION_ID=${SERVICE_BEEHIIVE_PUBID}
      - OPENAI_API_KEY=${SERVICE_OPENAI_KEY}

      # Sonstiges
      - NEXT_PUBLIC_DISCORD_SUPPORT=${NEXT_PUBLIC_DISCORD_SUPPORT}
      - NEXT_PUBLIC_POLOTNO=${NEXT_PUBLIC_POLOTNO}
      - IS_GENERAL=true
      - NX_ADD_PLUGINS=${NX_ADD_PLUGINS:-false}
      - NOT_SECURED=${NOT_SECURED:-false}

      # Payment
      - FEE_AMOUNT=${FEE_AMOUNT:-0.05}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_SIGNING_KEY=${STRIPE_SIGNING_KEY}
      - STRIPE_SIGNING_KEY_CONNECT=${STRIPE_SIGNING_KEY_CONNECT}
    volumes:
      # Bind-Mounts auf die Volumes der alten Instanz. Named Volumes gehen hier
      # nicht: Coolify praefixt die mit der eigenen Service-UUID und legt damit
      # leere Volumes an.
      - /var/lib/docker/volumes/vcjzigduzuxw3cp5xxydolt0_postiz-config/_data:/config/
      - /var/lib/docker/volumes/vcjzigduzuxw3cp5xxydolt0_postiz-uploads/_data:/uploads/
    depends_on:
      postiz-db:
        condition: service_healthy
      postiz-db-password-sync:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      postiz-temporal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:5000/
      interval: 5s
      timeout: 20s
      retries: 10

  postiz-db:
    image: postgres:14.5
    volumes:
      - /var/lib/docker/volumes/vcjzigduzuxw3cp5xxydolt0_postiz-postgresql-data/_data:/var/lib/postgresql/data
      - pg-socket:/var/run/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTIZ_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRESQL_DATABASE:-postiz-db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-postiz-db}"]
      interval: 5s
      timeout: 20s
      retries: 10

  # Das uebernommene Datenverzeichnis traegt noch das Passwort der alten
  # Instanz. POSTGRES_PASSWORD greift nur bei einer Neuinitialisierung, deshalb
  # wird das Rollen-Passwort hier an POSTIZ_DB_PASSWORD angeglichen - ueber den
  # Unix-Socket, der lokal auf trust steht.
  postiz-db-password-sync:
    image: postgres:14.5
    depends_on:
      postiz-db:
        condition: service_healthy
    volumes:
      - pg-socket:/var/run/postgresql
    environment:
      - NEW_PASSWORD=${POSTIZ_DB_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - echo "pw-laenge=$${#NEW_PASSWORD} sonderzeichen=$$(printf %s "$${NEW_PASSWORD}" | tr -d "[:alnum:]" | wc -c)" && psql -h /var/run/postgresql -U postgres -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD '$${NEW_PASSWORD}';" && touch /tmp/synced && echo "postgres password synced" && tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/synced"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Temporal legt sich seine beiden Schemas selbst in der vorhandenen Postgres
  # an (temporal, temporal_visibility) - die Postiz-DB bleibt unberuehrt.
  postiz-temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postiz-db:
        condition: service_healthy
      postiz-db-password-sync:
        condition: service_healthy
    environment:
      # auto-setup nutzt TEMPORAL_ADDRESS selbst, um den Server fuer die
      # Namespace-Registrierung zu erreichen. Ohne diese Zeile greift die
      # service-weite Coolify-Variable und zeigt auf den falschen Host.
      # Loopback funktioniert nicht: der Listener bindet per Default auf die
      # Container-IP, deshalb der eigene Servicename.
      - TEMPORAL_ADDRESS=postiz-temporal:7233
      - BIND_ON_IP=0.0.0.0
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postiz-db
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTIZ_DB_PASSWORD}
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - DEFAULT_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - DEFAULT_NAMESPACE_RETENTION=72h
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/postiz-temporal/7233' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  postiz-redis:
    image: redis:7.2
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}
    volumes:
      - postiz-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${SERVICE_PASSWORD_REDIS}
        - ping
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  # Redis haelt nur Queue-/Cache-Daten: bewusst frisch, damit keine haengenden
  # Jobs aus der kaputten Instanz uebernommen werden.
  postiz-redis-data:
  # Nur der Postgres-Socket, damit postgres-password-sync sich ohne Passwort
  # verbinden kann.
  pg-socket:
