# Coolify-Service-Compose fuer "postiz-neu" (uuid eaijhlfjved5n726vmknnhxd)
# auf dem dedizierten Server 167.233.77.146.
#
# WICHTIG - nicht umbenennen:
#   * Service-Namen  postiz / postgres / redis  == bestehende Coolify-Container
#   * Volume-Keys mit BINDESTRICH (postiz-config, postiz-uploads,
#     postiz-postgresql-data, postiz-redis-data). Coolify haengt die
#     Service-UUID davor; nur mit exakt diesen Keys trifft der Stack die
#     bereits migrierten Volumes. Das aktuelle Upstream-Template nutzt
#     UNTERSTRICHE - ein Copy&Paste von dort wuerde leere Volumes erzeugen
#     und die uebertragenen Daten verwaisen lassen.
#
# Aenderung gegenueber dem bisherigen Stand (v2.11.0):
#   * postiz  v2.11.0 -> v2.23.0  (enthaelt den LinkedIn-Fix)
#   * neuer Service "temporal" - ab v2.13 zwingend erforderlich
#   * TEMPORAL_ADDRESS fest auf temporal:7233 (kein ${...}, damit ein
#     veralteter Wert im Coolify-Env-Store nicht durchschlaegt)
services:
  postiz:
    image: 'ghcr.io/gitroomhq/postiz-app:v2.23.0'
    environment:
      - SERVICE_FQDN_POSTIZ_5000
      # Fest verdrahtet statt ${SERVICE_FQDN_POSTIZ}: diese Coolify-Variable
      # liefert den Hostnamen OHNE Schema. Bis v2.11 war das folgenlos, ab
      # v2.23 baut der MCP-Start new URL('/mcp-oauth', NEXT_PUBLIC_BACKEND_URL)
      # und stirbt dann mit ERR_INVALID_URL, was den Backend-Prozess in eine
      # Dauer-Restartschleife schickt.
      - 'MAIN_URL=https://postiz.gollenstede.app'
      - 'FRONTEND_URL=https://postiz.gollenstede.app'
      - 'NEXT_PUBLIC_BACKEND_URL=https://postiz.gollenstede.app/api'
      - 'JWT_SECRET=${SERVICE_PASSWORD_JWTSECRET}'
      - 'DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRESQL}@postgres:5432/${POSTGRESQL_DATABASE:-postiz-db}'
      - 'REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379'
      - 'BACKEND_INTERNAL_URL=http://localhost:3000'
      - 'TEMPORAL_ADDRESS=temporal:7233'
      - 'TEMPORAL_NAMESPACE=default'
      - 'CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}'
      - 'CLOUDFLARE_ACCESS_KEY=${CLOUDFLARE_ACCESS_KEY}'
      - 'CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}'
      - 'CLOUDFLARE_BUCKETNAME=${CLOUDFLARE_BUCKETNAME}'
      - 'CLOUDFLARE_BUCKET_URL=${CLOUDFLARE_BUCKET_URL}'
      - 'CLOUDFLARE_REGION=${CLOUDFLARE_REGION}'
      - 'STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}'
      - 'UPLOAD_DIRECTORY=${UPLOAD_DIRECTORY:-/uploads}'
      - 'NEXT_PUBLIC_UPLOAD_DIRECTORY=${NEXT_PUBLIC_UPLOAD_DIRECTORY:-/uploads}'
      - 'NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY=${NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY}'
      - 'RESEND_API_KEY=${RESEND_API_KEY}'
      - 'EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}'
      - 'EMAIL_FROM_NAME=${EMAIL_FROM_NAME}'
      - 'EMAIL_PROVIDER=${EMAIL_PROVIDER}'
      - 'X_API_KEY=${SERVICE_X_API}'
      - 'X_API_SECRET=${SERVICE_X_SECRET}'
      - 'LINKEDIN_CLIENT_ID=${SERVICE_LINKEDIN_ID}'
      - 'LINKEDIN_CLIENT_SECRET=${SERVICE_LINKEDIN_SECRET}'
      - 'REDDIT_CLIENT_ID=${SERVICE_REDDIT_API}'
      - 'REDDIT_CLIENT_SECRET=${SERVICE_REDDIT_SECRET}'
      - 'GITHUB_CLIENT_ID=${SERVICE_GITHUB_ID}'
      - 'GITHUB_CLIENT_SECRET=${SERVICE_GITHUB_SECRET}'
      - 'THREADS_APP_ID=${SERVICE_THREADS_ID}'
      - 'THREADS_APP_SECRET=${SERVICE_THREADS_SECRET}'
      - 'FACEBOOK_APP_ID=${SERVICE_FACEBOOK_ID}'
      - 'FACEBOOK_APP_SECRET=${SERVICE_FACEBOOK_SECRET}'
      - 'YOUTUBE_CLIENT_ID=${SERVICE_YOUTUBE_ID}'
      - 'YOUTUBE_CLIENT_SECRET=${SERVICE_YOUTUBE_SECRET}'
      - 'TIKTOK_CLIENT_ID=${SERVICE_TIKTOK_ID}'
      - 'TIKTOK_CLIENT_SECRET=${SERVICE_TIKTOK_SECRET}'
      - 'PINTEREST_CLIENT_ID=${SERVICE_PINTEREST_ID}'
      - 'PINTEREST_CLIENT_SECRET=${SERVICE_PINTEREST_SECRET}'
      - 'DRIBBBLE_CLIENT_ID=${SERVICE_DRIBBLE_ID}'
      - 'DRIBBBLE_CLIENT_SECRET=${SERVICE_DRIBBLE_SECRET}'
      - 'DISCORD_CLIENT_ID=${SERVICE_DISCORD_ID}'
      - 'DISCORD_CLIENT_SECRET=${SERVICE_DISCORD_SECRET}'
      - 'DISCORD_BOT_TOKEN_ID=${SERVICE_DISCORD_TOKEN}'
      - 'SLACK_ID=${SERVICE_SLACK_ID}'
      - 'SLACK_SECRET=${SERVICE_SLACK_SECRET}'
      - 'SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}'
      - 'MASTODON_CLIENT_ID=${SERVICE_MASTODON_ID}'
      - 'MASTODON_CLIENT_SECRET=${SERVICE_MASTODON_SECRET}'
      - 'INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}'
      - 'INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}'
      - 'BEEHIIVE_API_KEY=${SERVICE_BEEHIIVE_KEY}'
      - 'BEEHIIVE_PUBLICATION_ID=${SERVICE_BEEHIIVE_PUBID}'
      - 'OPENAI_API_KEY=${SERVICE_OPENAI_KEY}'
      - 'NEXT_PUBLIC_DISCORD_SUPPORT=${NEXT_PUBLIC_DISCORD_SUPPORT}'
      - 'NEXT_PUBLIC_POLOTNO=${NEXT_PUBLIC_POLOTNO}'
      - IS_GENERAL=true
      - 'NX_ADD_PLUGINS=${NX_ADD_PLUGINS:-false}'
      - 'NOT_SECURED=${NOT_SECURED:-false}'
      - 'DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-false}'
      - 'FEE_AMOUNT=${FEE_AMOUNT:-0.05}'
      - 'STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}'
      - 'STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}'
      - 'STRIPE_SIGNING_KEY=${STRIPE_SIGNING_KEY}'
      - 'STRIPE_SIGNING_KEY_CONNECT=${STRIPE_SIGNING_KEY_CONNECT}'
    # Ohne diese Angabe bleibt ServiceApplication.ports_exposes leer und
    # Traefik baut ueberhaupt keinen Router -> 404 trotz laufendem
    # Container. Die Port-Angabe im FQDN allein reicht nicht, Coolify
    # schneidet sie beim Setzen ueber die API wieder ab.
    expose:
      - '5000'
    # Eigene Traefik-Regeln, weil Coolifys generierte Labels hier nur einen
    # Router ohne Backend-Port erzeugen (Antwort: 503). Das Image exponiert
    # mehrere Ports (3000/4200/5000); ohne loadbalancer.server.port kann
    # Traefik sich nicht entscheiden. priority=1000 sorgt dafuer, dass diese
    # Router gegenueber den generierten gewinnen, die dieselbe Host-Regel
    # tragen. traefik.docker.network ist noetig, seit der Stack zusaetzlich
    # am geteilten coolify-Netz haengt - sonst waehlt Traefik u.U. die IP
    # aus dem Stack-eigenen Netz, das es selbst nicht erreicht.
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - 'traefik.http.routers.postiz-fix-https.rule=Host(`postiz.gollenstede.app`)'
      - traefik.http.routers.postiz-fix-https.entrypoints=https
      - traefik.http.routers.postiz-fix-https.tls=true
      - traefik.http.routers.postiz-fix-https.tls.certresolver=letsencrypt
      - traefik.http.routers.postiz-fix-https.service=postiz-fix
      - traefik.http.routers.postiz-fix-https.priority=1000
      - 'traefik.http.routers.postiz-fix-http.rule=Host(`postiz.gollenstede.app`)'
      - traefik.http.routers.postiz-fix-http.entrypoints=http
      - traefik.http.routers.postiz-fix-http.service=postiz-fix
      - traefik.http.routers.postiz-fix-http.priority=1000
      - traefik.http.services.postiz-fix.loadbalancer.server.port=5000
    volumes:
      - 'postiz-config:/config/'
      - 'postiz-uploads:/uploads/'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      # Bewusst /auth statt /: die Wurzel antwortet mit 307 auf MAIN_URL.
      # wget folgt dem Redirect, landet auf der oeffentlichen Domain und
      # schlaegt fehl, solange Traefik den Host noch nicht kennt - der
      # Container waere dann "unhealthy", obwohl die App laeuft.
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:5000/auth'
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 120s
  postgres:
    image: 'postgres:14.5'
    volumes:
      - 'postiz-postgresql-data:/var/lib/postgresql/data'
    environment:
      - POSTGRES_USER=postgres
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}'
      - 'POSTGRES_DB=${POSTGRESQL_DATABASE:-postiz-db}'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-postiz-db}'
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: 'redis:7.2'
    environment:
      - 'REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}'
    command: 'redis-server --requirepass ${SERVICE_PASSWORD_REDIS}'
    volumes:
      - 'postiz-redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - '-a'
        - '${SERVICE_PASSWORD_REDIS}'
        - ping
      interval: 5s
      timeout: 10s
      retries: 20
  # Ab Postiz v2.13 Pflicht. auto-setup legt die Datenbanken "temporal" und
  # "temporal_visibility" im vorhandenen Postgres an und registriert den
  # Namespace "default" selbst.
  # BIND_ON_IP=0.0.0.0, weil der gRPC-Listener sonst nur an die Container-IP
  # bindet und die Selbstregistrierung ins Leere laeuft.
  temporal:
    image: 'temporalio/auto-setup:1.28.1'
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - 'POSTGRES_PWD=${SERVICE_PASSWORD_POSTGRESQL}'
      - POSTGRES_SEEDS=postgres
      - BIND_ON_IP=0.0.0.0
      - 'TEMPORAL_ADDRESS=temporal:7233'
      - DEFAULT_NAMESPACE=default
      - DEFAULT_NAMESPACE_RETENTION=72h
      - SKIP_DEFAULT_NAMESPACE_CREATION=false
      # Visibility ueber Elasticsearch statt ueber Postgres. Grund: Postiz
      # registriert beim Backend-Start mehr als drei Suchattribute vom Typ
      # "Text". Die SQL-Visibility hat dafuer fest nur drei Spalten
      # (Text01..Text03), deshalb bricht das Backend sonst mit
      #   INVALID_ARGUMENT: cannot have more than 3 search attribute of type Text
      # ab und laeuft in eine Restart-Schleife. Das ist ein Schema-Limit,
      # keine Einstellung - ES ist der vom Postiz-Projekt vorgesehene Weg.
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - 'DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml'
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
  # Nur Visibility-Store fuer Temporal, keine Postiz-Daten. Heap bewusst klein
  # (256 MB), damit der Stack auf der 4-GB-Maschine Luft behaelt.
  # discovery.type=single-node schaltet zugleich die Bootstrap-Checks ab, sonst
  # scheitert ES am vm.max_map_count des Hosts.
  elasticsearch:
    image: 'elasticsearch:7.17.27'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms256m -Xmx256m'
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    volumes:
      - 'temporal-elasticsearch-data:/usr/share/elasticsearch/data'
    expose:
      - '9200'
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"'''
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
